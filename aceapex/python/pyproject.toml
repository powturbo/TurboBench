[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aceapex"
version = "2.5.0"
description = "Read ACEAPEX (.aet) archives: whole, by region, or by batch of ranges. C99 decoder, libzstd only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Yakiv Shavidze" }]
classifiers = ["Programming Language :: C", "Programming Language :: Python :: 3", "Topic :: System :: Archiving :: Compression"]

[project.urls]
Homepage = "https://github.com/yasha1971-coder/aceapex"

[tool.setuptools]
packages = ["aceapex"]
