name: Release Turbobench

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            executable: turbobench
            artifact: turbobench-linux-x86_64
            cmake_args: ''
            
          # Linux aarch64 (cross-compile)
          - os: ubuntu-latest
            arch: aarch64
            executable: turbobench
            artifact: turbobench-linux-aarch64
#            cmake_args: ''
#            cmake_args: '-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++'
            
          # macOS x86_64
 #         - os: macos-13 # macos-13 runs on Intel
 #           arch: x86_64
 #           executable: turbobench
 #           artifact: turbobench-macos-x86_64
 #           cmake_args: ''
            
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest # macos-latest (14+) runs on Apple Silicon
            arch: aarch64
            executable: turbobench
            artifact: turbobench-macos-aarch64
 #           cmake_args: ''
            
          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            executable: turbobench.exe
            artifact: turbobench-windows-x86_64.exe
  #          cmake_args: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compiler (Linux aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

#      - name: Configure CMake
#        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: make
#       run: cmake --build build --config Release

      - name: Prepare Artifact
        shell: bash
        run: |
          # Find the built executable and rename it
          # Depending on your CMake configuration, it might be in build/ or build/Release/
          if [ -f "build/Release/${{ matrix.executable }}" ]; then
            mv "build/Release/${{ matrix.executable }}" "${{ matrix.artifact }}"
          elif [ -f "build/${{ matrix.executable }}" ]; then
            mv "build/${{ matrix.executable }}" "${{ matrix.artifact }}"
          else
            echo "Executable not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

