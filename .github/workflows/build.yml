name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: ["gcc", "clang"]
    env:      
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'     
      - run: git submodule update --init --recursive
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - run: make STATIC=1      
      - run: lscpu
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U

  macos:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:      
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive      
      - name: Install NASM
        run: brew install nasm        
      - run: make NMEMSIZE=1     
      - run: sysctl -n machdep.cpu.brand_string
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash

      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git make cmake rsync mingw-w64-x86_64-gcc
          update: true

      - run: git submodule update --init --recursive

      # ---- FIX for ar.exe "Can't open temporary file" ----
      - name: Fix temporary directory for MinGW ar.exe
        run: |
          # Create a reliable temp dir that both MSYS2 and Windows can see
          mkdir -p /tmp
          # Force every tool (including ar.exe) to use it
          echo "TMPDIR=/tmp" >> $GITHUB_ENV
          echo "TMP=/tmp"   >> $GITHUB_ENV
          echo "TEMP=/tmp"  >> $GITHUB_ENV
          # Also export for the current shell
          export TMPDIR=/tmp TMP=/tmp TEMP=/tmp
          echo "Using TMPDIR=$TMPDIR"

      - run: make
      - run: ./turbobench -l2
      - run: ./turbobench turbobench.exe -U -V0
      
