name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        compiler: ["gcc", "clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm 
#libomp-dev
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
      - run: |
          lscpu
          gcc --version
          clang --version || true
          rustc --version
          cargo --version
      - run: make
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U
      - run: ./turbobench silesia.tar -V0 -U
  linux-riscv:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc", "clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm make gcc-14 g++-14 clang-20
          sudo update-alternatives --install /usr/bin/gcc  gcc  /usr/bin/gcc-14  100
          sudo update-alternatives --install /usr/bin/g++  g++  /usr/bin/g++-14  100
          sudo update-alternatives --install /usr/bin/cc   cc   /usr/bin/gcc-14  100
          sudo update-alternatives --install /usr/bin/c++  c++  /usr/bin/g++-14  100
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-20   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100 || true
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
      - name: Show environment
        run: |
          uname -m
          lscpu
          echo "=== Using CC=$CC ==="
          $CC --version
          gcc --version
          clang --version || true
          rustc --version
          cargo --version
      - name: Build 
        run: make
      - name: benchmark
        if: matrix.compiler == 'gcc'  # clang 20 emits illegal instruction
        run: |
          ./turbobench -l2
#          ./turbobench turbobench -V0 -U
#          ./turbobench silesia.tar -V0 -U
