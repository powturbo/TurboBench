name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    name: ${{ matrix.os }}-${{ matrix.compiler }}
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: ubuntu-26.04-arm
            compiler: gcc
            cxx: g++
          - os: ubuntu-26.04-arm
            compiler: clang
            cxx: clang++
#          - name: linux-riscv64
#            os: ubuntu-24.04-riscv
#            platform: linux
#            arch: riscv64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig (master)
        uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
#          version: master
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libomp-dev golang
      - name: Shoe Environemt
        run: |
          lscpu
          gcc --version
          clang --version || true
          rustc --version
          cargo --version
          zig version
      - name: Build
        run: make BLOSC=0 OPENZL=0 PIVCO=0 RUST=0
#      - name: Download silesia.tar.gz and gunzip → silesia.tar
#        run: |
#          curl -L -o silesia.tar.gz \
#            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
#          gunzip silesia.tar.gz

      - name: Benchmark
        run: |
          ./turbobench blaris/bench/data/* -U -eMICRO -aMICRO -i1,1
          cat data@MICRO.tbb
#          ./turbobench -h
#      - run: ./turbobench turbobench -V0 -U
#      - run: ./turbobench silesia.tar -V0 -U
#      - run: ./turbobench silesia.tar -V0 -U -eBWT -abwt

  linux-riscv:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install 
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig (master)
        uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm make libomp-dev golang
          sudo apt-get install -y -qq gcc-14 g++-14 clang-20
          sudo update-alternatives --install /usr/bin/gcc  gcc  /usr/bin/gcc-14  100
          sudo update-alternatives --install /usr/bin/g++  g++  /usr/bin/g++-14  100
          sudo update-alternatives --install /usr/bin/cc   cc   /usr/bin/gcc-14  100
          sudo update-alternatives --install /usr/bin/c++  c++  /usr/bin/g++-14  100
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-20   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100 || true

      - name: Show environment
        run: |
          uname -m
          lscpu
          echo "=== Using CC=$CC ==="
          make -p -f /dev/null | grep '^CXX'
          $CC --version
          gcc --version
          clang --version || true
          rustc --version
          cargo --version
      - name: Build 
        run: make AOCL=0 BLOSC=0 BROTLI=0 FLZMA=0 GLZA=0 KANZI=0 LIZARD=0 LZFSE=0 LZHAM=0 LZO=0 LZRAVEN=0 LZSA=0 MINIZ=0 OPENZL=0 OPENMP=0 PIVCO=0 RUST=0 WZIP=0 XZ=0
#      - name: Download silesia.tar.gz and gunzip → silesia.tar
#        run: |
#          curl -L -o silesia.tar.gz \
#            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
#          gunzip silesia.tar.gz
      - name: Benchmark
        if: matrix.compiler == 'gcc' 
        run: |
          ./turbobench -l2
          ./turbobench blaris/bench/data/* -U -eMICRO -aMICRO
#          cat data@MICRO.tbb
#          ./turbobench blaris/bench/data/* -U -elz0,1C -aMICRO -i1,1
#          cat data@MICRO.tbb

  macos:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install
        run: |
          brew install nasm libomp llvm golang
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          cc -v
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Make
        run: make OPENZL=0 PIVCO=0 RUST=0
      - name: benchmark
        run: |
          ./turbobench blaris/bench/data/* -U -eMICRO -aMICRO -i1,1
          cat data@MICRO.tbb
#      - name: Download silesia.tar.gz and gunzip → silesia.tar
#        run: |
#          curl -L -o silesia.tar.gz https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
