name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: ["gcc", "clang"]
    env:      
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'     
      - run: git submodule update --init --recursive
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - run: make STATIC=1      
      - run: lscpu
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0

  macos:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:      
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive      
      - name: Install NASM
        run: brew install nasm        
      - run: make      
      - run: sysctl -n machdep.cpu.brand_string
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # FIX: Disable automatic CRLF conversion before checkout
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git make cmake rsync mingw-w64-x86_64-gcc
          update: true
      - run: git submodule update --init --recursive
      - run: make STATIC=1
      - run: ./turbobench -l2
      - run: ./turbobench turbobench.exe -V0

