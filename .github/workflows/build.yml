name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        compiler: ["gcc", "clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm 
#libomp-dev
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
      - run: |
          lscpu
          gcc --version
          clang --version || true
      - run: make
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U
      - run: ./turbobench silesia.tar -V0 -U

  linux-riscv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc", "clang"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive

      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz

      - name: Build & test on riscv64 (QEMU)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: riscv64
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
	  install: |
	    apt-get update -qq
	    apt-get install -y -qq \
	      build-essential nasm make \
	      gcc-14 g++-14 \
	      clang-19   
            # Make gcc-14 / g++-14 the default "gcc" / "g++"
  	    update-alternatives --install /usr/bin/gcc  gcc  /usr/bin/gcc-14  100
	    update-alternatives --install /usr/bin/g++  g++  /usr/bin/g++-14  100
	    update-alternatives --install /usr/bin/cc   cc   /usr/bin/gcc-14  100
	    update-alternatives --install /usr/bin/c++  c++  /usr/bin/g++-14  100
  	    # Optional: also make a "clang" symlink point at the new one
            update-alternatives --install /usr/bin/clang  clang  /usr/bin/clang-18  100
            update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100 || true
            # Sanity check
	    which gcc; gcc --version
            which clang; clang --version || true
          run: |
            export CC=${{ matrix.compiler }}
            echo "=== Using compiler: $CC ==="
            $CC --version
            uname -m
            make
            ./turbobench -l2
            ./turbobench turbobench -V0 -U
            ./turbobench silesia.tar -V0 -U

  macos:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install dependencies
        run: |
          brew install nasm libomp
          cc -v
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
      - run: make
      - run: sysctl -n machdep.cpu.brand_string
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U
      - run: ./turbobench silesia.tar -V0 -U

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            cmake
            rsync
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
      - run: git submodule update --init --recursive
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
      - run: make
      - run: ./turbobench -l2
      - run: ./turbobench turbobench.exe -U -V0
      - run: ./turbobench.exe silesia.tar -U -V0
