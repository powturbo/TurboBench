name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  linux:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        compiler: ["gcc", "clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - run: git submodule update --init --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm libomp-dev

      - run: |
          lscpu
          gcc --version
          clang --version || true

      - run: make
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U

  macos:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - run: git submodule update --init --recursive

      - name: Install dependencies
        run: |
          brew install nasm libomp

      - run: make
      - run: sysctl -n machdep.cpu.brand_string
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash

      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git make cmake rsync
            mingw-w64-x86_64-gcc
# Optional: uncomment if you want LLVM/Clang
# mingw-w64-x86_64-clang
# mingw-w64-x86_64-openmp
          update: true

      - run: git submodule update --init --recursive

      - run: make
      - run: ./turbobench -l2
      - run: ./turbobench turbobench.exe -U -V0
