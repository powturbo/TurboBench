name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    name: ${{ matrix.os }}-${{ matrix.compiler }}
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: ubuntu-26.04-arm
            compiler: gcc
            cxx: g++
          - os: ubuntu-26.04-arm
            compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm 
          sudo apt-get install libomp-dev
      - run: make BLOSC=0 OPENZL=0 PIVCO=0 RUST=0
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
      - run: |
          lscpu
          gcc --version
          clang --version || true
          rustc --version
          cargo --version
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U
      - run: ./turbobench silesia.tar -V0 -U
      - run: ./turbobench silesia.tar -V0 -U -eBWT -abwt
  linux-riscv:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        compiler: ["gcc", "clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm make gcc-14 g++-14 clang-20
          sudo update-alternatives --install /usr/bin/gcc  gcc  /usr/bin/gcc-14  100
          sudo update-alternatives --install /usr/bin/g++  g++  /usr/bin/g++-14  100
          sudo update-alternatives --install /usr/bin/cc   cc   /usr/bin/gcc-14  100
          sudo update-alternatives --install /usr/bin/c++  c++  /usr/bin/g++-14  100
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-20   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100 || true
      - name: Show environment
        run: |
          uname -m
          lscpu
          echo "=== Using CC=$CC ==="
          make -p -f /dev/null | grep '^CXX'
          $CC --version
          gcc --version
          clang --version || true
          rustc --version
          cargo --version
      - name: make 
        run: make AOCL=0 BLOSC=0 OPENZL=0 PIVCO=0 OPENMP=0 RUST=0 
#      - name: Download silesia.tar.gz and gunzip → silesia.tar
#        run: |
#          curl -L -o silesia.tar.gz \
#            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
#          gunzip silesia.tar.gz
      - name: benchmark
        if: matrix.compiler == 'gcc' 
        run: |
          ./turbobench -l2
          ./turbobench turbobench -U -i0,0
          ./turbobench turbobench -U -eBWT -abwt -i0,0
#          ./turbobench silesia.tar -U -i0,0
#          ./turbobench silesia.tar -U -eBWT -abwt -i0,0

  macos:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - name: Install dependencies
        run: |
          brew install nasm libomp
          cc -v
      - run: make OPENZL=0 PIVCO=0 RUST=0
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
          wget ftp://ita.ee.lbl.gov/traces/NASA_access_log_Jul95.gz
          gunzip NASA_access_log_Jul95.gz
          wget https://codeberg.org/pbm/former/raw/branch/master/data/enwik8.gz
          gunzip enwik8.gz
      - run: sysctl -n machdep.cpu.brand_string
      - run: ./turbobench -l2
      - run: ./turbobench turbobench -V0 -U
      - run: ./turbobench silesia.tar -V0 -U
      - run: ./turbobench silesia.tar -V0 -U -eBWT -abwt
      - run: ./turbobench silesia.tar -V0 -U -ebwtsatan,7x,8x,9x -b68m -abwt
      - run: ./turbobench NASA_access_log_Jul95 -V0 -eBWT -abwt 
      - run: ./turbobench enwik8 -V0 -eBWT -abwt 

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            cmake
            rsync
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-llvm-openmp
      - run: git submodule update --init --recursive
      - run: make OPENZL=0 PIVCO=0 RUST=0
      - name: Download silesia.tar.gz and gunzip → silesia.tar
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
          wget ftp://ita.ee.lbl.gov/traces/NASA_access_log_Jul95.gz
          gunzip NASA_access_log_Jul95.gz
          wget https://codeberg.org/pbm/former/raw/branch/master/data/enwik8.gz 
          gunzip enwik8.gz
      - run: ./turbobench -l2
      - run: ./turbobench turbobench.exe -U -V0
      - run: ./turbobench.exe silesia.tar -U -V0
      - run: ./turbobench silesia.tar -V0 -eBWT -abwt
      - run: ./turbobench silesia.tar -V0 -ebwtsatan,7x,8x,9x -b68m -abwt
      - run: ./turbobench NASA_access_log_Jul95 -V0 -eBWT -abwt 
      - run: ./turbobench enwik8 -V0 -eBWT -abwt 

