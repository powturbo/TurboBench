#      - run: ./turbobench NASA_access_log_Jul95 -V0 -eBWT -abwt 
#      - run: ./turbobench enwik8 -V0 -eBWT -abwt 

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip make cmake rsync
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-llvm-openmp
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-go
      - run: git submodule update --init --recursive
      - name: Install Zig
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0'
      - name: Make
        run: make OPENZL=0 PIVCO=0 RUST=0

