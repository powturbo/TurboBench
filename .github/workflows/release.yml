name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_NAME: turbobench
jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            platform: linux
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - name: linux-riscv64
            os: ubuntu-24.04-riscv
            platform: linux
            arch: riscv64
#          - name: macos-x86_64
#            os: macos-13
#            platform: macos
#            arch: x86_64
          - name: macos-aarch64
            os: macos-26
            platform: macos
            arch: aarch64
          - name: windows-x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
            msystem: UCRT64
            mingw_pkg: mingw-w64-ucrt-x86_64-gcc
 #         - name: windows-aarch64
 #           os: windows-11-arm
 #           platform: windows
 #           arch: aarch64
 #           msystem: CLANGARM64
 #           mingw_pkg: mingw-w64-clang-aarch64-gcc-compat
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      # ------------------ Linux ----------------
      - name: Install build tools (Linux)
        if: matrix.platform == 'linux' 
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential nasm make
          if [ "${{ matrix.os }}" = "ubuntu-24.04-riscv" ]; then
            sudo apt-get install -y -qq gcc-14 g++-14 clang-20
            sudo update-alternatives --install /usr/bin/gcc  gcc  /usr/bin/gcc-14  100
            sudo update-alternatives --install /usr/bin/g++  g++  /usr/bin/g++-14  100
            sudo update-alternatives --install /usr/bin/cc   cc   /usr/bin/gcc-14  100
            sudo update-alternatives --install /usr/bin/c++  c++  /usr/bin/g++-14  100
            sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-20   100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100 || true
          fi
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: make STATIC=1
      - name: Generate silesia.tar.md (Linux)
        if: matrix.platform == 'linux' && matrix.name != 'linux-riscv64'
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
          ./turbobench silesia.tar -U -V0
          ./turbobench silesia.tar.tbb -p4
          mv -f silesia.tar.md "silesia.${{ matrix.name }}.tar.md"
          ls -la silesia.*.tar.md
      # ---------------- macOS ----------------
      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install nasm libomp
          make
      - name: Generate silesia.tar.md (macOS)
        if: matrix.platform == 'macos'
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
          ./turbobench silesia.tar -U -V0
          ./turbobench silesia.tar.tbb -p4
          mv -f silesia.tar.md "silesia.${{ matrix.name }}.tar.md"
          ls -la silesia.*.tar.md
      # ---------------- Windows (MSYS2) ----------------
      - name: Set git to use LF
        if: matrix.platform == 'windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
        shell: bash
      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git zip make cmake rsync mingw-w64-x86_64-gcc mingw-w64-x86_64-clang
          update: true
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: make STATIC=1 PHAZ=0
      - name: Generate silesia.tar.md (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          curl -L -o silesia.tar.gz \
            https://github.com/DataCompression/corpus-collection/raw/main/Silesia-Corpus/silesia.tar.gz
          gunzip silesia.tar.gz
          ./turbobench.exe silesia.tar -U -V0
          ./turbobench.exe silesia.tar.tbb -p4
          mv -f silesia.tar.md "silesia.${{ matrix.name }}.tar.md"
          ls -la silesia.*.tar.md
      # ---------------- Package (Linux/macOS) ----------------
      - name: Package artifact (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -e
          DIST="dist/${APP_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$DIST"
          if [ -f "${APP_NAME}" ]; then
            cp "${APP_NAME}" "$DIST/"
          else
            find . -maxdepth 1 -type f -perm -u+x -iname "${APP_NAME}*" -exec cp {} "$DIST/" \;
          fi
          [ -f README.md ] && cp README.md "$DIST/" || true
          [ -f LICENSE ] && cp LICENSE "$DIST/" || true
          # silesia.*.tar.md is intentionally NOT packaged into the archive
          tar -C dist -czf "${APP_NAME}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            "${APP_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
      # ---------------- Package (Windows) ----------------
      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e
          DIST="dist/${APP_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$DIST"
          if [ -f "${APP_NAME}.exe" ]; then
            cp "${APP_NAME}.exe" "$DIST/"
          elif [ -f "${APP_NAME}" ]; then
            cp "${APP_NAME}" "$DIST/${APP_NAME}.exe"
          fi
          [ -f turbobench.ini ] && cp turbobench.ini "$DIST/" || true
          [ -f README.md ] && cp README.md "$DIST/" || true
          [ -f LICENSE ] && cp LICENSE "$DIST/" || true
          # silesia.*.tar.md is intentionally NOT packaged into the archive
          cd dist
          zip -r "../${APP_NAME}-${{ matrix.platform }}-${{ matrix.arch }}.zip" \
            "${APP_NAME}-${{ matrix.platform }}-${{ matrix.arch }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.name }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
            silesia.${{ matrix.name }}.tar.md
          if-no-files-found: ignore
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts into a release folder
        run: |
          mkdir -p release
          # Only ship the real binary packages – exclude silesia.*.tar.md
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  update-benchmark-md:
    name: Concatenate silesia results into benchmark.md
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Concatenate all silesia.*.tar.md into benchmark.md
        run: |
          # Start with a clean header
          {
            echo "# TurboBench Silesia Corpus Results"
            echo ""
            echo "Generated automatically by the Release workflow."
            echo ""
            echo "---"
            echo ""
          } > benchmark.md
          # Append each platform result in a deterministic order
          for f in $(find artifacts -name 'silesia.*.tar.md' | sort); do
            platform=$(basename "$f" | sed 's/^silesia\.//;s/\.tar\.md$//')
            echo "## Platform: ${platform}" >> benchmark.md
            echo "" >> benchmark.md
            cat "$f" >> benchmark.md
            echo "" >> benchmark.md
            echo "---" >> benchmark.md
            echo "" >> benchmark.md
            echo "Appended: $f"
          done
          echo ""
          echo "Final benchmark.md contents preview:"
          head -n 40 benchmark.md
          echo "..."
          wc -l benchmark.md
      - name: Commit and push benchmark.md (update if it already exists)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark.md
          if git diff --staged --quiet; then
            echo "No changes detected – benchmark.md is already up to date"
          else
            git commit -m "Update benchmark.md (concatenated Silesia results) from build ${{ github.ref_name || github.sha }}"
            git push
            echo "Successfully updated and pushed benchmark.md"
          fi
