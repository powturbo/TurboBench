  macos:
    runs-on: '\${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        compiler: ["clang"]
    env:      
      CC: \${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - run: git submodule update --init --recursive
      - run: make
      - run: sysctl -n machdep.cpu.brand_string
      - run: ./turbobench -l1
      - run: ./turbobench turbobench

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git make mingw-w64-x86_64-gcc
          update: true
      - run: git submodule update --init --recursive
      - run: make STATIC=1
      - run: ./turbobench -l1
      - run: ./turbobench turbobench.exe
