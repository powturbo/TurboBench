name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  linux:
    runs-on: '\${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        compiler: ["gcc", "clang"]
    env:      
      CC: \${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'     
      - run: git submodule update --init --recursive
      - run: make STATIC=1
      - run: lscpu
      - run: ./turbobench -l1
      - run: ./turbobench turbobench

